<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-labelledby="title description">
  <title id="title">Repo Pulse</title>
  <desc id="description">Cartão ilustrado do projeto Repo Pulse, um painel de telemetria para repositórios GitHub.</desc>

  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#071A24"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <style>
    .trace { animation: trace 4s ease-in-out infinite alternate; stroke-dasharray: 540; }
    .status { animation: status 2.4s ease-in-out infinite; }
    @keyframes trace { from { stroke-dashoffset: 90; } to { stroke-dashoffset: 0; } }
    @keyframes status { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .trace, .status { animation: none; } }
  </style>

  <rect x="10" y="10" width="540" height="310" rx="24" fill="url(#card)" stroke="#334155" filter="url(#shadow)"/>
  <path d="M34 72H526" stroke="#334155"/>

  <circle class="status" cx="39" cy="41" r="6" fill="#22C55E"/>
  <text x="56" y="47" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="750">Repo Pulse</text>
  <text x="524" y="45" fill="#67E8F9" font-family="Consolas, Courier New, monospace" font-size="12" font-weight="700" text-anchor="end">LIVE TELEMETRY</text>

  <g stroke="#334155" stroke-opacity="0.78">
    <path d="M42 107H518M42 145H518M42 183H518M42 221H518"/>
    <path d="M82 92V231M162 92V231M242 92V231M322 92V231M402 92V231M482 92V231"/>
  </g>

  <path d="M42 208C77 205 96 188 128 192S180 216 213 174S264 188 301 151S351 170 389 131S447 145 518 96V231H42Z" fill="url(#area)"/>
  <path class="trace" d="M42 208C77 205 96 188 128 192S180 216 213 174S264 188 301 151S351 170 389 131S447 145 518 96" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(42 250)">
      <rect width="146" height="48" rx="12" fill="#FFFFFF" fill-opacity="0.045" stroke="#475569"/>
      <text x="73" y="21" fill="#A78BFA" font-size="15" font-weight="750">8 snapshots/dia</text>
      <text x="73" y="37" fill="#94A3B8" font-size="11">coleta automatizada</text>
    </g>
    <g transform="translate(207 250)">
      <rect width="146" height="48" rx="12" fill="#FFFFFF" fill-opacity="0.045" stroke="#475569"/>
      <text x="73" y="21" fill="#A78BFA" font-size="15" font-weight="750">~180 dias</text>
      <text x="73" y="37" fill="#94A3B8" font-size="11">histórico preservado</text>
    </g>
    <g transform="translate(372 250)">
      <rect width="146" height="48" rx="12" fill="#FFFFFF" fill-opacity="0.045" stroke="#475569"/>
      <text x="73" y="21" fill="#67E8F9" font-size="15" font-weight="750">GitHub Pages</text>
      <text x="73" y="37" fill="#94A3B8" font-size="11">deploy contínuo</text>
    </g>
  </g>
</svg>
